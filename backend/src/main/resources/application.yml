server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: govstart-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# Application Specific Properties
govstart:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-key: ${INTERNAL_AI_KEY:govstart-internal-ai-secret-2026}
    timeout-ms: 10000
  admin-bootstrap:
    secret: ${ADMIN_BOOTSTRAP_SECRET:GovStartBootstrapKey2026Secure}

logging:
  level:
    root: INFO
    com.govstart: DEBUG
    org.springframework.security: INFO
